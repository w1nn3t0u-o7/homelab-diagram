# Inventory for the homelab diagram: everything the picture shows comes from this file.
# build.py reads it; the positions of the boxes are hand-placed in build.py.
#
# This lab is not the example's lab: one Docker host behind CGNAT, no VLANs, no
# hypervisor, no port forwards. So the rows under `networks` are networks (not
# VLANs), `public_routes` takes the place of `port_forwards`, and the host's
# stacks are what the example drew as Proxmox guests.

meta:
  title: "My Homelab"
  title_redacted: "My Homelab"
  date: "November 2026"
  watermark: "w1nn3t0u"
  domain: "w1nn3t0u.com"             # your real domain; only shown with --unredacted

redact:
  domain: true                       # default render replaces the domain with domain_placeholder
  domain_placeholder: "redacted.com"

networks:   # order = table order
  - {key: lan,   tag: "LAN",     name: "Home LAN",       subnet: "192.168.100.0/24",   color: "#58a6ff",
     note: "flat · no VLANs · the router hands out AdGuard as DNS"}
  - {key: proxy, tag: "docker",  name: "proxy",          subnet: "10.42.0.0/24",       color: "#f0883e",
     note: "shared by cloudflared, caddy and every stack"}
  - {key: back,  tag: "docker",  name: "stack backends", subnet: "10.43–45 · 172.18",  color: "#bc8cff",
     note: "one per stack · databases stay off proxy"}
  - {key: ts,    tag: "tailnet", name: "Tailscale",      subnet: "100.64.0.0/10",      color: "#39c5cf",
     note: "the private door · WireGuard mesh · no size cap"}
  - {key: wan,   tag: "CGNAT",   name: "the ISP",        subnet: "shared IPv4",        color: "#f85149",
     note: "no inbound port exists to forward"}

internet:
  cloud_services:
    - {icon: cloudflare, name: "Cloudflare", note: "DNS · TLS at the edge · the tunnel route"}
    - {icon: onedrive,   name: "OneDrive",   note: "offsite restic copy, via rclone"}

isp:
  name: "ISP router"
  type: "CGNAT gateway"
  ip: "192.168.100.1"
  os: "ISP-managed · DHCP + Wi-Fi"
  note: "no port forwards to set up — there is nothing to forward to"

tailnet:
  name: "Your devices"
  note: "on the mesh · split DNS sends *.local.{domain} to AdGuard"
  devices:
    - {name: "desktop-omarchy", icon: "cachyos", os: "CachyOS", lan: "192.168.100.5", ts: "100.104.31.116"}
    - {name: "laptop-omarchy",  icon: "cachyos", os: "CachyOS", lan: "—",             ts: "100.82.203.67 · offline"}
    - {name: "iPhone",          icon: "apple",   os: "iOS",     lan: "—",             ts: "100.122.84.68"}

why:                                     # small card in the left column: why the lab looks like this
  title: "Why this shape"
  points:
    - "CGNAT: the ISP shares one public IPv4, so no inbound port exists. Nothing on the internet can dial in."
    - "Both doors dial out instead — a Cloudflare tunnel and a Tailscale mesh. That is the whole design."
    - "Publishing takes two deliberate steps: a Cloudflare route and a Caddyfile block. Never one."

host:
  name: "dell-server"
  type: "Docker host"
  model: "Dell Inspiron 13-5378 · a 2017 laptop"
  ip: "192.168.100.16"
  tailnet: "100.70.224.107"
  os: "Ubuntu Server 26.04.1 · kernel 7.0 · Docker 29.1"
  note: "no GPU: Immich's machine-learning container runs on these two cores"
  hw:
    - {icon: glyph-cpu,  label: "CPU",     value: "Intel i5-7200U",       sub: "2 cores · 4 threads"}
    - {icon: glyph-ram,  label: "MEMORY",  value: "15 GB DDR4",           sub: "4 GB swap · ~12 GB free"}
    - {icon: glyph-ssd,  label: "SSD",     value: "Micron 1100 238 GB",   sub: "SATA · LVM root, 98 GB"}
    - {icon: glyph-ssd,  label: "SSD",     value: "Crucial X8 1 TB",      sub: "USB · /mnt/data · 322 GiB used"}
    - {icon: glyph-wifi, label: "NETWORK", value: "Wi-Fi 5 · wlp1s0",     sub: "the uplink — no ethernet here"}
    - {icon: glyph-nic,  label: "NETWORK", value: "tailscale0",           sub: "the private door · 100.70.224.107"}
    - {icon: glyph-shield, label: "POWER",  value: "the laptop battery",   sub: "a small built-in UPS"}

doors:                                   # the containers that are the two doors, plus DNS
  - {key: tunnel, icon: cloudflared, name: "cloudflared", tag: "PUBLIC DOOR",
     ports: "no published port · outbound only", note: "keeps a connection to Cloudflare open"}
  - {key: caddy,  icon: caddy,       name: "Caddy",       tag: "THE ROUTER",
     ports: ":80 public · :443 tailnet", note: "one Caddyfile: every hostname → service"}
  - {key: adguard, icon: adguard,    name: "AdGuard Home", tag: "DNS",
     ports: ":53 LAN + tailnet · :3000 admin", note: "DoH upstream · the wildcard rewrite"}

listening:                               # what actually listens on the host, and for whom
  title: "Listening on the host"
  note: "nothing is forwarded — the router has no public address to forward to"
  ports:
    - {port: "22",    what: "SSH"}
    - {port: "53",    what: "AdGuard DNS"}
    - {port: "80",    what: "Caddy · public"}
    - {port: "443",   what: "Caddy · tailnet"}
    - {port: "3000",  what: "AdGuard admin"}
    - {port: "8384",  what: "Syncthing UI"}
    - {port: "22000", what: "Syncthing sync"}

public_routes:                           # replaces the example's port forwards: there are none
  - {host: "",         service: "Portfolio",    what: "static site · no login",       pill: "tunnel"}
  - {host: "cloud",    service: "Nextcloud",    what: "share links + login page",     pill: "tunnel"}
  - {host: "photos",   service: "Immich",       what: "album share links",            pill: "tunnel"}
  - {host: "app",      service: "MPT project",  what: "SPA + API · own stack",        pill: "tunnel"}

storage:
  title: "Storage"
  note: "the data lives on one USB SSD — no RAID, no mirror"
  disks:
    - {name: "/mnt/data", device: "Crucial X8 1 TB · USB", pct: 35, used: "322 GiB used · 548 GiB free"}
    - {name: "/",         device: "Micron 1100 238 GB · LVM 98 GB", pct: 40, used: "39 GB used · 54 GB free"}
  footer: "photos, nextcloud-data and the database dumps are all on the same disk"

backups:
  title: "BACKUPS"
  steps:
    - {name: "03:00 dumps",  note: "mariadb + pg_dumpall, verified"}
    - {name: "/mnt/data/backups", note: "gzip, one file per database"}
    - {name: "Zerobyte",     note: "restic: schedule + retention"}
    - {name: "rclone",       note: "encrypted remote"}
    - {name: "OneDrive",     note: "offsite, not on the LAN"}

stacks:                                  # container groups on the host
  - name: "PUBLIC"
    note: "via the tunnel · TLS ends at Cloudflare"
    exposed: public
    guests:
      - name: "Portfolio"
        icons: [hugo]
        note: "the website · static, no login, no data"
        endpoint: "{domain} + www"
        meta: "built from its own repo · the image is the commit"
        exposure: public
      - name: "Nextcloud"
        icons: [nextcloud]
        note: "files, calendars, contacts"
        endpoint: "cloud.{domain}"
        meta: "4 containers · db + redis off the proxy net"
        exposure: public
      - name: "Immich"
        icons: [immich]
        note: "photos & videos · album shares"
        endpoint: "photos.{domain}"
        meta: "4 containers · vectorchord + valkey · ML on the CPU"
        exposure: public
  - name: "PRIVATE"
    note: "tailnet only · real TLS from Caddy"
    exposed: private
    guests:
      - name: "Karakeep"
        icons: [karakeep]
        note: "bookmarks, full-text search, AI tagging"
        endpoint: "karakeep.local.{domain}"
        meta: "3 containers · meilisearch + headless chrome"
        exposure: private
      - name: "Zerobyte"
        icons: [glyph-backup]
        note: "restic with a UI: jobs, retention, restores"
        endpoint: "zerobyte.local.{domain}"
        meta: "1 container · no docker socket, no SYS_ADMIN"
        exposure: private
      - name: "Uptime Kuma"
        icons: [uptime-kuma]
        note: "monitors every public hostname"
        endpoint: "uptime.local.{domain}"
        meta: "1 container · sqlite in ./data"
        exposure: private
  - name: "ALSO HERE"
    note: "one public app, one host service"
    guests:
      - name: "MPT project"
        icons: [docker]
        note: "a second app, its own repo and stack"
        endpoint: "app.{domain}"
        meta: "3 containers · nginx + node + postgres"
        exposure: public
        apps:
          - {icon: nginx,      name: "web", note: "SPA + /healthz", port: ":80"}
          - {icon: nodejs,     name: "api", note: "node", port: ":3000"}
          - {icon: postgresql, name: "db",  note: "postgres 16", port: ":5432"}
      - name: "Syncthing"
        icons: [syncthing]
        note: "file sync to your own devices"
        endpoint: "syncthing.local.{domain}"
        meta: "systemd on the host, not a container"
        exposure: host

two_doors:                               # the explainer panel along the bottom
  public:
    title: "PUBLIC DOOR"
    sub: "Cloudflare Tunnel"
    rows:
      - {k: "entry",  v: "Cloudflare edge · TLS ends there, no certificate on the server"}
      - {k: "how",    v: "cloudflared dials out and holds the connection open"}
      - {k: "carries",v: "the website, share links, and the login pages next to them"}
      - {k: "limit",  v: "the plan's request-body cap: 100 MB · Nextcloud chunks, Immich does not"}
      - {k: "breaks", v: "if cloudflared dies, every public name dies with it"}
  private:
    title: "PRIVATE DOOR"
    sub: "Tailscale mesh"
    rows:
      - {k: "entry",  v: "WireGuard between your devices · 100.x.y.z, no Cloudflare"}
      - {k: "names",  v: "AdGuard rewrites *.local.{domain} → the tailnet address"}
      - {k: "tls",    v: "one wildcard cert from Caddy, DNS-01, real padlock"}
      - {k: "limit",  v: "none — a 2 GB upload is the app's problem, not the path's"}
      - {k: "breaks", v: "if Tailscale is down you have the tunnel; if both, the console"}
